<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dungeon Party</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0d0d14;color:#e8e4d8;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#16161f;border:1px solid #2a2a3a;border-radius:14px;padding:28px;width:100%;max-width:380px}
h1{font-size:1.5rem;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:#888;font-size:.85rem;margin-bottom:22px}
input{width:100%;padding:11px;margin-bottom:10px;background:#0d0d14;border:1px solid #33334a;
  border-radius:8px;color:#e8e4d8;font-size:1rem}
button{width:100%;padding:11px;border:0;border-radius:8px;background:#c9a227;color:#111;
  font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:8px}
button.ghost{background:transparent;color:#c9a227;border:1px solid #c9a227}
.err{color:#e74c3c;font-size:.85rem;text-align:center;min-height:1.2em;margin-bottom:8px}
#game{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.gold{font-size:1.2rem;color:#f5c542;font-weight:700}
.dungeon{background:#101018;border:1px solid #2f2f45;border-radius:12px;padding:18px;text-align:center;margin-bottom:14px}
.dname{font-weight:700;margin-bottom:4px}
.dsub{color:#888;font-size:.85rem}
.log{font-size:.78rem;color:#7a7a90;max-height:120px;overflow-y:auto;background:#0d0d14;border-radius:8px;padding:10px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#22223a;
  color:#e8e4d8;padding:11px 22px;border-radius:10px;font-size:.92rem;opacity:0;
  transition:opacity .35s;pointer-events:none;z-index:99;border:1px solid #3a3a55;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:98;
  align-items:center;justify-content:center;padding:16px}
.modal .card{max-width:420px}
</style>
</head>
<body>
<div class="card" id="auth">
  <h1>⚔️ Dungeon Party</h1>
  <div class="sub">Idle DnD — fase 0</div>
  <div class="err" id="authErr"></div>
  <input id="user" placeholder="Username" autocomplete="username">
  <input id="pass" type="password" placeholder="Password (min 6)" autocomplete="current-password">
  <button onclick="doLogin()">Masuk</button>
  <button class="ghost" onclick="doRegister()">Daftar Baru</button>
</div>

<div class="card" id="game">
  <div class="top">
    <span id="pname">—</span>
    <span class="gold" id="gold">🪙 0</span>
    <button class="ghost" style="width:auto;padding:6px 12px;margin:0" onclick="logout()">⏏</button>
  </div>
  <div class="dungeon">
    <div class="dname">🕳️ Gua Goblin</div>
    <div class="dsub" id="dstat">Party farming otomatis · 1-3 gold/s</div>
  </div>
  <div id="heroBox" style="display:none" class="dungeon">
    <div class="dname" id="hnama">—</div>
    <div class="dsub" id="hstat">—</div>
    <div style="background:#0d0d14;border-radius:8px;height:10px;margin-top:8px;overflow:hidden">
      <div id="xpbar" style="height:100%;width:0%;background:linear-gradient(90deg,#c9a227,#f5c542)"></div>
    </div>
  </div>
  <button id="btnChoose" style="display:none" onclick="showClasses()">Pilih Hero</button>
  <div id="classList"></div>
  <div id="shopBox" style="display:none">
    <button class="ghost" onclick="buy('potion_kecil')">🧪 Potion Kecil — 50g</button>
    <button class="ghost" onclick="buy('potion_besar')">🧴 Potion Besar — 180g</button>
  </div>
  <div class="dungeon" id="bagBox" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div class="dname">🎒 Tas <span id="bagCount" style="color:#c9a227;font-weight:400"></span></div>
      <button class="ghost" style="width:auto;padding:6px 12px;margin:0" onclick="upgradeBag()" id="bagUpBtn">+5 slot</button>
    </div>
    <div id="bagItems" style="font-size:.85rem;color:#aaa;line-height:1.7"></div>
  </div>
  <div class="log" id="log"></div>
</div>

<!-- Modal detail hero + konfirmasi -->
<div class="modal" id="modal" onclick="if(event.target===this)mdClose()">
  <div class="card">
    <div id="mdBody"></div>
    <button id="btnYes">✔ Pilih Hero Ini</button>
    <button class="ghost" onclick="mdClose()">Batal</button>
  </div>
</div>

<script>
let token = localStorage.getItem('dp_token');
let S = null;          // state player dari server
let gold = 0, xpGain = 0;
const $ = id => document.getElementById(id);
const api = (path, body) => fetch('/api/'+path, {
  method:'POST', headers:{'Content-Type':'application/json', Authorization: token||''},
  body: JSON.stringify(body||{})
}).then(r=>r.json());

function log(msg){ const l=$('log'); l.innerHTML = msg+'<br>'+l.innerHTML.slice(0,2000); }

async function doRegister(){
  const r = await api('register',{user:$('user').value.trim(),pass:$('pass').value});
  if(r.err) return $('authErr').textContent=r.err;
  afterAuth(r);
}
async function doLogin(){
  const r = await api('login',{user:$('user').value.trim(),pass:$('pass').value});
  if(r.err) return $('authErr').textContent=r.err;
  afterAuth(r);
}
async function afterAuth(r){
  token=r.token; localStorage.setItem('dp_token',token); localStorage.setItem('dp_name',r.username);
  await loadState();
}
async function loadState(){
  const r = await fetch('/api/state',{headers:{Authorization:token}}).then(r=>r.json());
  if(r.err) return logout();
  S = r; gold = r.gold;
  $('auth').style.display='none'; $('game').style.display='block';
  $('pname').textContent='⚔️ '+r.username; render();
}
function logout(){ localStorage.removeItem('dp_token'); location.reload(); }

// ---------- TAS / INVENTORY ----------
// Stack rules: potion/material/farm = 1 slot gabung; equipment (weapon/cape/
// helm/boot/armor) = tiap item 1 slot terpisah.
// inv format: {stack: {item_id: qty}, equip: [{id, uid}]}
const EQUIP_KINDS = ['weapon','cape','helm','boot','armor'];
const BASE_SLOTS = 20;

function bagSlots(){
  return BASE_SLOTS + (S.data.bag_lv||0)*5;   // upgrade tas: +5 slot/level
}
function bagUsed(inv){
  const stack = inv.stack ? Object.keys(inv.stack).length : 0;
  const equip = inv.equip ? inv.equip.length : 0;
  return stack + equip;
}
function isEquip(id){
  // id equipment mulai dgn kind, mis. "wep_", "cape_" (config fase 2)
  return EQUIP_KINDS.some(k => id.startsWith(k.slice(0,3)));
}
function bagFull(inv){
  return bagUsed(inv) >= bagSlots();
}
function addItem(inv, id, qty){
  if(isEquip(id)){
    for(let i=0;i<qty;i++){
      if(bagFull(inv)) return false;
      inv.equip.push({id, uid: Date.now()+'-'+Math.random().toString(36).slice(2,7)});
    }
    return true;
  }
  if(!inv.stack[id] && bagFull(inv)) return false;
  inv.stack[id] = (inv.stack[id]||0) + qty;
  return true;
}

function render(){
  const h = S.data && S.data.hero;
  $('gold').textContent='🪙 '+Math.floor(gold).toLocaleString('id');
  if(!h){
    $('btnChoose').style.display='block';
    $('heroBox').style.display='none'; $('shopBox').style.display='none';
    return;
  }
  $('btnChoose').style.display='none';
  $('heroBox').style.display='block'; $('shopBox').style.display='block';
  $('bagBox').style.display='block';
  const need = Math.round(50*Math.pow(1.35,h.lvl-1));
  $('hnama').textContent = h.nama || h.class.toUpperCase();
  $('hstat').textContent = `Lv.${h.lvl} · ATK ${h.atk} · HP ${h.hp_max} · XP ${h.xp}/${need} · Power ${S.power}`;
  $('xpbar').style.width = Math.min(100, h.xp/need*100)+'%';
  renderBag();
}

function renderBag(){
  const inv = S.data.inv || {stack:{},equip:[]};
  const used = bagUsed(inv), slots = bagSlots();
  $('bagCount').textContent = `${used}/${slots}`;
  const rows = [];
  for(const [id,q] of Object.entries(inv.stack||{}))
    rows.push(`<span style="display:inline-block;background:#1c1c2a;border-radius:6px;padding:3px 10px;margin:2px">${ITEM_NAME[id]||id} ×${q}</span>`);
  for(const e of (inv.equip||[]))
    rows.push(`<span style="display:inline-block;background:#2a1f33;border-radius:6px;padding:3px 10px;margin:2px;border:1px solid #4a3a5a">${ITEM_NAME[e.id]||e.id}</span>`);
  $('bagItems').innerHTML = rows.join('') || '<i style="color:#555">Tas kosong — beli potion atau farming buat isi tas</i>';
  // tombol upgrade: harga ×1.6 per level
  const lv = S.data.bag_lv||0;
  let cost = 200; for(let i=0;i<lv;i++) cost = cost*8/5|0;
  $('bagUpBtn').textContent = `+5 slot (${cost.toLocaleString('id')}g)`;
  $('bagUpBtn').disabled = gold < cost;
  $('bagUpBtn').style.opacity = gold < cost ? .45 : 1;
}

async function upgradeBag(){
  const r = await api('bag',{action:'upgrade'});
  if(r.err) return toast('❌ '+r.err);
  S = r; gold = r.gold;
  toast(`🎒 Tas di-upgrade! Sekarang ${bagSlots()} slot`); render();
}
const ITEM_NAME = {'potion_kecil':'🧪 Potion HP Kecil','potion_besar':'🧴 Potion HP Besar'};

async function showClasses(){
  const list = await fetch('/api/classes').then(r=>r.json());
  window._classes = list;
  $('classList').innerHTML = list.map(c=>
    `<button class="ghost" onclick="heroDetail('${c.id}')">${c.nama} — HP ${c.hp} / ATK ${c.atk}</button>`).join('');
}

// modal detail + konfirmasi sebelum hero terpilih
function heroDetail(id){
  const c = window._classes.find(x=>x.id===id);
  const EL = {api:'🔥 Api', alam:'🌿 Alam', listrik:'⚡ Listrik', air:'💧 Air', cahaya:'☀️ Cahaya', gelap:'🌑 Gelap'};
  $('mdBody').innerHTML = `
    <div class="dname" style="font-size:1.3rem">${c.nama}</div>
    <div style="color:#c9a227;margin:4px 0 10px">Elemen: ${EL[c.element]||c.element}</div>
    <div style="display:flex;gap:14px;margin-bottom:12px">
      <span>❤️ HP ${c.hp}</span><span>⚔️ ATK ${c.atk}</span>
    </div>
    <p style="color:#aaa;line-height:1.55;font-size:.9rem;font-style:italic">"${c.lore}"</p>`;
  $('btnYes').onclick = ()=>choose(c.id);
  $('modal').style.display='flex';
}
function mdClose(){ $('modal').style.display='none'; }

async function choose(cls){
  const r = await api('choose',{class:cls});
  if(r.err) return toast('❌ '+r.err);
  S = r; gold = r.gold; mdClose();
  $('classList').innerHTML='';   // hilangkan pilihan, hero terkunci
  render(); toast('✨ Hero terpilih!');
}

// notifikasi melayang (toast)
function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.style.opacity='1');
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),400); },2600);
}

// idle tick: 1 detik = 1 tick farm
setInterval(()=>{
  if($('game').style.display==='none' || !S || !S.data.hero) return;
  const g = 1 + Math.floor(Math.random()*3);   // 1-3 gold
  gold += g; xpGain += 2;                       // xp 2/tick
  const h = S.data.hero;
  h.xp += 2;
  const need = Math.round(50*Math.pow(1.35,h.lvl-1));
  while(h.xp >= need){ /* server recompute saat save */ }
  render();
},1000);

// save tiap 30 detik — kirim gold+xp, server validasi
async function saveNow(){
  if(!S) return;
  // kirim delta ke /api/farm
  const r = await api('farm',{gold_delta: gold - S.gold, xp_delta: xpGain});
  if(!r.err){ S = r; gold = r.gold; xpGain = 0; }
  render();
}
setInterval(saveNow, 30000);
window.addEventListener('beforeunload', ()=>{ navigator.sendBeacon && saveNow(); });

async function buy(item){
  const r = await api('shop',{item});
  if(r.err) return toast('❌ '+r.err);
  S = r; gold = r.gold; render(); toast('🛒 '+(ITEM_NAME[item]||item)+' dibeli ✅');
}

if(token) loadState();
</script>
</body>
</html>
