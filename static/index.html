<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dungeon Party</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0d0d14;color:#e8e4d8;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#16161f;border:1px solid #2a2a3a;border-radius:14px;padding:28px;width:100%;max-width:380px}
h1{font-size:1.5rem;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:#888;font-size:.85rem;margin-bottom:22px}
input{width:100%;padding:11px;margin-bottom:10px;background:#0d0d14;border:1px solid #33334a;
  border-radius:8px;color:#e8e4d8;font-size:1rem}
button{width:100%;padding:11px;border:0;border-radius:8px;background:#c9a227;color:#111;
  font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:8px}
button.ghost{background:transparent;color:#c9a227;border:1px solid #c9a227}
.err{color:#e74c3c;font-size:.85rem;text-align:center;min-height:1.2em;margin-bottom:8px}
#game{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.gold{font-size:1.2rem;color:#f5c542;font-weight:700}
.dungeon{background:#101018;border:1px solid #2f2f45;border-radius:12px;padding:18px;text-align:center;margin-bottom:14px}
.dname{font-weight:700;margin-bottom:4px}
.dsub{color:#888;font-size:.85rem}
.log{font-size:.78rem;color:#7a7a90;max-height:120px;overflow-y:auto;background:#0d0d14;border-radius:8px;padding:10px;margin-top:12px}
</style>
</head>
<body>
<div class="card" id="auth">
  <h1>⚔️ Dungeon Party</h1>
  <div class="sub">Idle DnD — fase 0</div>
  <div class="err" id="authErr"></div>
  <input id="user" placeholder="Username" autocomplete="username">
  <input id="pass" type="password" placeholder="Password (min 6)" autocomplete="current-password">
  <button onclick="doLogin()">Masuk</button>
  <button class="ghost" onclick="doRegister()">Daftar Baru</button>
</div>

<div class="card" id="game">
  <div class="top">
    <span id="pname">—</span>
    <span class="gold" id="gold">🪙 0</span>
    <button class="ghost" style="width:auto;padding:6px 12px;margin:0" onclick="logout()">⏏</button>
  </div>
  <div class="dungeon">
    <div class="dname">🕳️ Gua Goblin</div>
    <div class="dsub">Party farming otomatis · 1-3 gold / tick</div>
  </div>
  <div class="log" id="log"></div>
</div>

<script>
let token = localStorage.getItem('dp_token');
const $ = id => document.getElementById(id);
const api = (path, body) => fetch('/api/'+path, {
  method:'POST', headers:{'Content-Type':'application/json', Authorization: token||''},
  body: JSON.stringify(body||{})
}).then(r=>r.json());

function log(msg){ const l=$('log'); l.innerHTML = msg+'<br>'+l.innerHTML; }

async function doRegister(){
  const r = await api('register',{user:$('user').value.trim(),pass:$('pass').value});
  if(r.err) return $('authErr').textContent=r.err;
  afterAuth(r);
}
async function doLogin(){
  const r = await api('login',{user:$('user').value.trim(),pass:$('pass').value});
  if(r.err) return $('authErr').textContent=r.err;
  afterAuth(r);
}
async function afterAuth(r){
  token=r.token; localStorage.setItem('dp_token',token); localStorage.setItem('dp_name',r.username);
  await loadState();
}
async function loadState(){
  const r = await fetch('/api/state',{headers:{Authorization:token}}).then(r=>r.json());
  if(r.err) return logout();
  $('auth').style.display='none'; $('game').style.display='block';
  $('pname').textContent='⚔️ '+r.username; $('gold').textContent='🪙 '+r.gold.toLocaleString('id');
}
function logout(){ localStorage.removeItem('dp_token'); location.reload(); }

// idle tick lokal + save tiap 30 detik
setInterval(()=>{
  if($('game').style.display!=='none'){
    // placeholder fase1: farm logic di sini
  }
},1000);

if(token) loadState();
</script>
</body>
</html>
